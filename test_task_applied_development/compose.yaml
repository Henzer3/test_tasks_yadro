services:
  app:
    image: app:latest
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: app
    restart: unless-stopped
    ports:
      - "28082:8080"
    environment:
      - APP_ADDRESS=:8080
      - DB_ADDRESS=postgres://postgres:password@postgres:5432/postgres?sslmode=disable
    volumes:
      - ./server/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
      image: postgres:18
      container_name: postgres
      restart: unless-stopped
      ports:
        - "5432:5432"
      environment:
        POSTGRES_PASSWORD: password
      volumes:
        - postgres:/var/lib/postgresql
      healthcheck:
        test: [ "CMD", "pg_isready" ]
        interval: 10s
        retries: 5
        start_period: 30s
        timeout: 10s

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: unless-stopped
    ports:
      - "18888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@test.com
      PGADMIN_DEFAULT_PASSWORD: password
      PGADMIN_DISABLE_POSTFIX: "true"
    volumes:
      - pgadmin:/var/lib/pgadmin
    depends_on:
      - postgres


volumes:
  postgres:
  pgadmin: